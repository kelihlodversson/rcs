name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  m68k:
    name: Build for m68k
    # the mintelf PPA has packages for this release; ubuntu-latest may not
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the m68k toolchain
        run: |
          sudo add-apt-repository -y ppa:vriviere/mintelf
          sudo apt-get update -qq
          sudo apt-get install -y cross-mintelf-essential
          pip3 install kconfiglib
      - name: Build
        run: make m68k
      - name: Check that it is a GEMDOS program
        run: |
          test "$(od -A n -t x1 -N 2 build/m68k/RCS.PRG | tr -d ' ')" = 601a
      - uses: actions/upload-artifact@v4
        with:
          name: rcs-m68k
          path: build/m68k/RCS.PRG

  arm:
    name: Build for ARM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi
          pip3 install kconfiglib
      - name: Build
        run: make arm
      - uses: actions/upload-artifact@v4
        with:
          name: rcs-arm
          path: build/arm/RCS.PRG
